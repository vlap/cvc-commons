name: Validation Agent
on:
  pull_request:
    paths:
      - 'workflows/**/scripts/*'
      - 'workflows/**/metadata.yaml'
  schedule:
    - cron: '0 9 * * 1'
jobs:
  lint_and_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint.sh
        run: |
          chmod +x workflows/prediction-data/tests/lint.sh
          ./workflows/prediction-data/tests/lint.sh
