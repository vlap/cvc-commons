name: Intake Agent
on:
  push:
    paths:
      - 'workflows/**/scripts/*'
jobs:
  generate_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install jinja2 pyyaml
      - name: Generate docs
        run: python scripts/generate_docs.py
      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          title: "docs: auto-generate ${{ github.event.head_commit.message }}"
          body: "Intake Agent generated docs for updated scripts."
          branch: "intake-docs-${{ github.sha }}"
          labels: "docs"