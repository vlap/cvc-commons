name: Intake Agent
on:
  push:
    paths:
      - 'workflows/**/scripts/*'
jobs:
  generate_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install gh-aw
        run: pip install gh-aw
      - name: Run Intake Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gh aw --agent "Intake Agent" \
               --instructions 'Generate docs for new/modified scripts using metadata.yaml.' \
               --engine gemini \
               --model gemini-1.5-flash
      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          title: "docs: auto-generate ${{ github.event.head_commit.message }}"
          body: "Intake Agent generated docs for updated scripts."
          branch: "intake-docs-${{ github.sha }}"
          labels: "docs"