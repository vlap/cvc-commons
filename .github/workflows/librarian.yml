name: Librarian Agent
on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [ main ]
    paths:
      - 'workflows/**/metadata.yaml'
jobs:
  maintain_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install jinja2 pyyaml boto3
      - name: Update WORKFLOWS.md
        run: python3 scripts/update_workflows_index.py
      - name: Generate missing workflow docs
        run: |
          if [ ! -f "docs/_workflows/download_en4.md" ]; then
            echo "::warning::docs/_workflows/download_en4.md not found. Generating..."
            python3 scripts/generate_docs.py
          fi
      - name: Suggest doc improvements
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ ! -f "docs/_workflows/download_en4.md" ]; then
            echo "::error::docs/_workflows/download_en4.md still missing."
            exit 1
          fi
          pip install boto3
          python3 scripts/improve_docs_aws.py
      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          title: "docs: weekly maintenance and validation"
          body: "Librarian Agent updated WORKFLOWS.md and validated docs."
          branch: "librarian-update-${{ github.sha }}"
          labels: "docs"