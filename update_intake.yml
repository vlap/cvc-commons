name: Update Intake Workflow Permissions
on: workflow_dispatch
jobs:
  update_permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - name: Update workflow permissions
        run: |
          sed -i 's/generate_docs:/generate_docs:
    permissions:
      contents: write/' .github/workflows/intake.yml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/intake.yml
          git commit -m "fix: add write permissions to Intake Agent workflow"
          git push origin main
